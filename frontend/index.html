<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name ="viewport" content="width=device-width, initial-scale=1" />
    <title> ЛР1 - Мій застосунок</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./src/main.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Система пропусків у комп'ютерний клас</h1>
        </header>

        <div id="notice"></div>
        <div id="status"></div>

        <main class="layout">
            <section>
                <h2>Додати пропуск</h2>
                <form id="createForm">
                    <div class="field">
                        <label for="userInput">Ім'я</label>
                        <input id="userInput" type="text" />
                        <p class="error-text" id="userError"></p>
                    </div>

                    <div class="field">
                        <label for="reasonSelect">Статус</label>
                        <select id="reasonSelect">
                            <option value="">Вибір причини пропуску</option>
                            <option value="Study">Студент</option>
                            <option value="Exam">Іспит</option>
                            <option value="Admin">Викладач</option>
                        </select>
                        <p class="error-text" id="reasonError"></p>
                    </div>

                    <div class="field">
                        <label for="dateInput">Дата входу</label>
                        <input id="dateInput" type="date" />
                        <p class="error-text" id="dateError"></p>
                    </div>

                    <div class="field">
                        <label for="commentInput">Примітка</label>
                        <textarea id="commentInput" rows="3"></textarea>
                        <p class="error-text" id="commentError"></p>
                    </div>

                    <div class="buttons">
                        <button type="submit">Додати</button>
                        <button type="button" id="resetBtn">Очистити</button>
                    </div>
                </form>
            </section>

            <section>
                <h2>Список пропусків</h2>

                <p id="passesCount">Всього пропусків: 0</p>

                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ім'я</th>
                            <th>Статус</th>
                            <th>Дата</th>
                            <th>Примітка</th>
                            <th>Дія</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </section>

<section class="api-panel">

    <h2>Сервісні функції</h2>

    <div class="api-search">
        <input
            id="searchInput"
            type="text"
            placeholder="Введіть ім'я користувача"
        >

        <button id="searchBtn" class="api-btn">
            Пошук пропусків
        </button>
    </div>

    <div class="api-buttons">

        <button id="healthBtn" class="api-btn">
            Перевірити сервер
        </button>

        <button id="countBtn" class="api-btn">
            Кількість пропусків
        </button>

        <button id="logsBtn" class="api-btn">
            Інформація пропусків
        </button>

        <button id="seedBtn" class="api-btn">
            Додати тестові дані
        </button>

        <button id="topUsersBtn" class="api-btn">
    ТОП-3 користувачів
</button>

    </div>

</section>

<section class="api-panel">

    <h2>Користувачі та пропуски</h2>

    <h3>Користувачі</h3>

    <input
        id="userIdInput"
        type="number"
        placeholder="ID користувача"
    >

    <button id="createUserBtn" class="api-btn">
        Створити користувача
    </button>

    <button id="getUserBtn" class="api-btn">
        Отримати користувача
    </button>

    <h3>Пропуски</h3>

    <input
        id="passIdInput"
        type="number"
        placeholder="ID пропуску"
    >

    <button id="passByIdBtn" class="api-btn">
        Отримати пропуск
    </button>

    <button id="updatePassBtn" class="api-btn">
        Оновити пропуск
    </button>

    <pre id="apiOutput"></pre>

</section>
        </main>
    </div>
</body>
</html>
